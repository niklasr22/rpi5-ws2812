[metadata]
name = rpi5-ws2812
version = attr: rpi5_ws2812.__version__
author = Niklas Rousset
author_email = byrousset@gmail.com
description = A library to control WS2812 LEDs with a Raspberry Pi 5
keywords = raspberry, pi, rpi, ws2812, led, spi
license_expression = MIT
long_description = file: README.md
long_description_content_type = text/markdown
classifiers = 
    Programming Language :: Python :: 3
    Operating System :: POSIX :: Linux
url = https://github.com/niklasr22/rpi5-ws2812
project_urls =
    Bug Tracker = https://github.com/niklasr22/rpi5-ws2812/issues


[options]
include_package_data = True
python_requires = >=3.11
install_requires =
    spidev>=3.8
    numpy>=1.26.4
package_dir=
    =src
packages=find:

[options.packages.find]
where=src
